name: lego-inventur-dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lego_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-lego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql+psycopg://lego:${POSTGRES_PASSWORD:-dev_only_change_me}@db:5432/${POSTGRES_DB:-lego_inventory}
      REBRICKABLE_API_KEY: ${REBRICKABLE_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
volumes:
  pgdata_dev:
