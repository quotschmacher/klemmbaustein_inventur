name: Container-Images veröffentlichen

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Image-Namen vorbereiten
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/klemmbaustein_inventur-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
